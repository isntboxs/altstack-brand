<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Altstack approved logo kit</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				color: var(--foreground, #111);
				font: 14px/1.5 var(--font-sans, system-ui);
			}
			p {
				margin: 0 0 16px;
				color: var(--muted-foreground, #666);
			}
			.pair {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 12px;
			}
			.panel {
				padding: 26px;
				border-radius: var(--radius, 10px);
				background: #fff;
				min-height: 144px;
				display: flex;
				align-items: center;
				justify-content: center;
				border: 1px solid #ddd;
			}
			.panel.dark {
				background: #000;
				border-color: #000;
			}
			.lockup {
				width: 100%;
				max-width: 280px;
				height: auto;
			}
			.details {
				display: grid;
				grid-template-columns: 1fr 1fr 1fr;
				gap: 12px;
				margin-top: 12px;
			}
			.details > div {
				padding: 20px 16px;
				background: #fff;
				border: 1px solid #ddd;
				border-radius: var(--radius, 10px);
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 16px;
				min-height: 104px;
			}
			.stacked {
				width: 94px;
				height: auto;
			}
			.app {
				width: 64px;
				height: 64px;
				border-radius: 14px;
			}
			.mockups {
				width: 100%;
				height: auto;
				display: block;
				margin-top: 16px;
				border: 1px solid #ddd;
				border-radius: var(--radius, 10px);
			}
			.caption {
				font-size: 12px;
				margin: 16px 0 0;
			}
			@media (max-width: 480px) {
				.pair {
					grid-template-columns: 1fr;
				}
				.panel {
					min-height: 114px;
				}
				.details > div {
					padding: 16px 10px;
					gap: 10px;
				}
				.stacked {
					width: 80px;
				}
			}
		</style>
	</head>
